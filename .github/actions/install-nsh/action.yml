# Installs the nsh 0.4.0 CLI with the upstream install scripts, on every
# runner OS, and puts it on PATH for the later steps of the job.
name: Install nsh 0.4.0
runs:
  using: composite
  steps:
    - name: Install NSH (Linux and macOS)
      if: runner.os != 'Windows'
      shell: bash
      env:
        NSH_VERSION: v0.4.0
      run: |
        curl -fsSL https://nsh.dev/install.sh | sh
        echo "$HOME/.nsh/bin" >> "$GITHUB_PATH"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        PATH="$HOME/.nsh/bin:$HOME/.local/bin:$PATH" nsh --version
    - name: Install NSH (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        NSH_VERSION: v0.4.0
      run: |
        irm https://nsh.dev/install.ps1 | iex
        "$env:LOCALAPPDATA\nsh\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
        $env:Path = "$env:LOCALAPPDATA\nsh\bin;$env:Path"
        nsh --version
