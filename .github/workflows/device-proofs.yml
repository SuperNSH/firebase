# The Android device proof (criterion 5): the host app on an emulator,
# notification delivery and the token failure surfaced clearly. The iOS
# equivalent (criterion 4) lives in ci-macos.yml. Manual, because the
# software-mode emulator takes around 15 minutes per run.
name: device-proofs

on:
  workflow_dispatch:

jobs:
  android-proofs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4
        with:
          gradle-version: "9.3.1"
      - run: gradle -p examples/host-android :app:assembleDebug
      - name: Boot the emulator and run the proofs
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          # API 33: the first attempt on API 34 ANRed the System UI under
          # CI's software emulation before the app's bundle finished loading.
          api-level: 33
          arch: x86_64
          # Software-mode boots on CI runners are slow.
          boot-timeout: 1200
          disable-animations: true
          script: |
            set -euo pipefail
            mkdir -p docs/evidence/native-android
            adb install examples/host-android/app/build/outputs/apk/debug/app-debug.apk
            (adb logcat -v time > docs/evidence/native-android/logcat.txt 2>&1 & echo $! > /tmp/logpid)
            # Software emulation is slow enough that system dialogs fire;
            # keep them down so the screenshots show the app, not an ANR.
            adb shell settings put secure anr_show_background false || true
            adb shell am start -n dev.nsh.firebase.host/.MainActivity
            sleep 40
            adb exec-out screencap -p > docs/evidence/native-android/host-emulator-1.png
            # The module's own notification path, then the FCM auto-post
            # press path — the drive commands docs/status/native-android.md
            # documents for this module.
            adb shell am start -n dev.nsh.firebase.host/.MainActivity --es dev.nsh.firebase.NOTIFICATION ci-proof-1
            sleep 10
            adb exec-out screencap -p > docs/evidence/native-android/host-emulator-2.png
            adb shell input keyevent KEYCODE_HOME
            sleep 4
            adb shell am start -n dev.nsh.firebase.host/.MainActivity --es google.message_id ci-proof-2
            sleep 10
            adb exec-out screencap -p > docs/evidence/native-android/host-emulator-3.png
            grep -i -m 40 -E "firebase|FCM|token|dev\.nsh\.firebase" docs/evidence/native-android/logcat.txt > docs/evidence/native-android/token-proof.log || true
            kill "$(cat /tmp/logpid)" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: native-android-proofs
          path: docs/evidence/native-android/
