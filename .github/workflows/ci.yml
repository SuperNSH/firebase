# The compile and test gates for nsh-firebase. Local runs are limited to
# implementation only (the build machine is often on battery), so CI is the
# place every gate is expected to pass. nsh 0.4.0 ships from longbridge/tap
# as an arm64-macOS formula, which pins the TSX jobs to macos-14.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NSH_VERSION: "0.4.0"

jobs:
  rust-gate:
    # The crates are developed against macOS; keep the whole gate on one
    # proven platform rather than risking linux-only nsh-crate breakage.
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  packages:
    # Every package area's TSX gate: nsh check, a warning-gated nsh build,
    # then the headless UI tests (scripts/test-packages.sh skips stubs).
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: brew tap longbridge/tap && brew install longbridge/tap/nsh && nsh --version
      - run: bun install
      - run: bun run test:packages

  emulator:
    # The labelled sandbox tests under project demo-nsh: sign up, sign in,
    # refresh, database write/read/live listener, storage upload/download/
    # delete, analytics+monitor against the collector. No real account.
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: brew tap longbridge/tap && brew install longbridge/tap/nsh && nsh --version
      - run: bun install
      # Java 21 mis-evaluates some cloud-storage rules (see docs/evidence/
      # core/storage-rules-fix.log); the glob form works everywhere, and 17
      # keeps the runtime on the well-tested path.
      - run: bun tools/collector/server.ts --out docs/evidence/perfmon/collector.jsonl &
      - run: bun run test:emulator

  demo:
    # The TSX demo gates plus the demo-rs crate gate.
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: brew tap longbridge/tap && brew install longbridge/tap/nsh && nsh --version
      - run: bun install
      - run: bash scripts/test-demo.sh
      - run: bash scripts/gate-crate.sh demo-rs

  clean-proof:
    # Criterion 3: the emulator tests pass from a clean checkout with one
    # documented command (bun install && bun run test:emulator).
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: brew tap longbridge/tap && brew install longbridge/tap/nsh && nsh --version
      - name: Clean clone, one command
        run: |
          rm -rf /tmp/nsh-firebase-clean
          git clone -q --no-hardlinks "$GITHUB_WORKSPACE" /tmp/nsh-firebase-clean
          cd /tmp/nsh-firebase-clean
          bun install --frozen-lockfile
          bun run test:emulator

  host-ios:
    # The embedding host and the Swift package compile against the iOS
    # Simulator SDK; SPM resolves the pinned firebase-ios-sdk.
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version && xcrun simctl list devicetypes | tail -3
      - uses: actions/cache@v4
        with:
          path: |
            native/ios/NshFirebase/.build
            examples/host-ios/build/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('native/ios/NshFirebase/Package.swift') }}
      - run: cd native/ios/NshFirebase && swift build
      - run: cd examples/host-ios && xcodegen generate
      - run: cd examples/host-ios && xcodebuild -project NshFirebaseHost.xcodeproj -scheme NshFirebaseHost -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build build

  host-android:
    # The Firebase BoM module and the embedding host app assemble with the
    # Android SDK preinstalled on ubuntu runners.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - run: echo "ANDROID_HOME=$ANDROID_HOME" && gradle -p native/android assembleDebug
      - run: gradle -p examples/host-android :app:assembleDebug
