# The compile and test gates for nsh-firebase. Every compile, test and demo
# build runs on GitHub's runners, never on a developer's machine. kache caches
# compiler outputs in GitHub's Actions cache; only main saves to it. A push to
# main with every gate green replaces the `latest` release with the demo builds
# and deploys the web build to GitHub Pages (https://supernsh.github.io/nsh-firebase/).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  LINUX_PACKAGES: dbus dbus-user-session gnome-keyring libgtk-4-dev libwebkitgtk-6.0-dev clang llvm

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt
      # cargo metadata loads every member, and demo-rs path-depends on the siblings.
      - uses: ./.github/actions/setup-siblings
      - run: cargo fmt --all -- --check

  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy
      - uses: kunobi-ninja/kache-action@ad7317540dcdd71c904f7a60a87b620a0c0e67ed # v1
        with:
          version: v2.0.0
          cache-dir: ${{ runner.temp }}/kache
          manifest-key: rust-${{ matrix.os }}
          cache-key-prefix: kache-rust-${{ matrix.os }}
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          pr-comment: false
      # The workspace's demo-rs member path-depends on the sibling libs.
      - uses: ./.github/actions/setup-siblings
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --no-fail-fast

  cross-check:
    name: check (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-ios }
          - { os: macos-latest, target: aarch64-apple-ios-sim }
          - { os: ubuntu-latest, target: aarch64-linux-android }
          # nsh-firebase-database depends on nsh-engine (the QuickJS runtime), whose
          # getrandom 0.4 needs its wasm_js feature on wasm32-unknown-unknown.
          - { os: ubuntu-latest, target: wasm32-unknown-unknown, skip: "--exclude nsh-firebase-database" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy
          targets: ${{ matrix.target }}
      - uses: kunobi-ninja/kache-action@ad7317540dcdd71c904f7a60a87b620a0c0e67ed # v1
        with:
          version: v2.0.0
          cache-dir: ${{ runner.temp }}/kache
          manifest-key: check-${{ matrix.target }}
          cache-key-prefix: kache-check-${{ matrix.target }}
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          pr-comment: false
      - uses: ./.github/actions/setup-siblings
      - name: Point cc at the NDK
        if: matrix.target == 'aarch64-linux-android'
        run: |
          bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "CC_aarch64_linux_android=$bin/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$bin/llvm-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$bin/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          # bindgen in quickjs-jit-sys otherwise parses the host's libc headers.
          sysroot="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          echo "BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android=--target=aarch64-linux-android24 --sysroot=$sysroot" >> "$GITHUB_ENV"
      # demo-rs is a host app with dev-dependencies that only run on the host; the library crates are checked for the target.
      - run: cargo clippy --workspace --exclude demo-rs ${{ matrix.skip }} --lib --target ${{ matrix.target }} -- -D warnings

  packages:
    # Every package area's TSX gate: nsh check, a warning-gated nsh build,
    # then the headless UI tests (scripts/test-packages.sh skips stubs).
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
      - uses: ./.github/actions/install-nsh
      - run: bun install
      - run: bun run test:packages

  emulator:
    # The labelled sandbox tests under project demo-nsh: sign up, sign in,
    # refresh, database write/read/live listener, storage upload/download/
    # delete, analytics+monitor against the collector. No real account.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: kunobi-ninja/kache-action@ad7317540dcdd71c904f7a60a87b620a0c0e67ed # v1
        with:
          version: v2.0.0
          cache-dir: ${{ runner.temp }}/kache
          manifest-key: emulator
          cache-key-prefix: kache-emulator
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          pr-comment: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: ./.github/actions/install-nsh
      - uses: ./.github/actions/setup-siblings
      - run: bun install
      # Java 21 mis-evaluates some cloud-storage rules (see docs/evidence/
      # core/storage-rules-fix.log); the glob form works everywhere, and 17
      # keeps the runtime on the well-tested path.
      - run: bun tools/collector/server.ts --out docs/evidence/perfmon/collector.jsonl &
      - run: bun run test:emulator

  demo:
    # The TSX demo gates plus the demo-rs crate gate.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: kunobi-ninja/kache-action@ad7317540dcdd71c904f7a60a87b620a0c0e67ed # v1
        with:
          version: v2.0.0
          cache-dir: ${{ runner.temp }}/kache
          manifest-key: demo
          cache-key-prefix: kache-demo
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          pr-comment: false
      - uses: ./.github/actions/install-nsh
      - uses: ./.github/actions/setup-siblings
        with:
          with-demo-links: "true"
      - run: bun install
      - run: bash scripts/test-demo.sh
      - run: bash scripts/gate-crate.sh demo-rs

  clean-proof:
    # Criterion 3: the emulator tests pass from a clean checkout with one
    # documented command (bun install && bun run test:emulator).
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: kunobi-ninja/kache-action@ad7317540dcdd71c904f7a60a87b620a0c0e67ed # v1
        with:
          version: v2.0.0
          cache-dir: ${{ runner.temp }}/kache
          manifest-key: clean-proof
          cache-key-prefix: kache-clean-proof
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          pr-comment: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: ./.github/actions/install-nsh
      - name: Clean clone, one command
        run: |
          rm -rf /tmp/nsh-firebase-clean
          git clone -q --no-hardlinks "$GITHUB_WORKSPACE" /tmp/nsh-firebase-clean
          # Siblings beside the clean clone at the pinned commits (see
          # .github/actions/setup-siblings).
          git clone -q https://github.com/SuperNSH/nsh-query.git /tmp/nsh-query
          git clone -q https://github.com/SuperNSH/nsh-form.git /tmp/nsh-form
          git -C /tmp/nsh-query checkout -q 470e10a49f0e4e44148a6a08e229a55867eb9688
          git -C /tmp/nsh-form checkout -q 682844a08bb5de5b5a0d196d8ea383cce7dcba2b
          cd /tmp/nsh-firebase-clean
          bun install --frozen-lockfile
          bun run test:emulator

  host-ios:
    # The embedding host app builds for the simulator. The device proof that
    # runs the app and pushes a notification is ci-macos.yml (manual).
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: xcodebuild -version
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            native/ios/NshFirebase/.build
            examples/host-ios/build/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('native/ios/NshFirebase/Package.swift') }}
      # Not `swift build`: the manifest declares only iOS, so a macOS host build
      # resolves to macOS 10.13 and the Firebase products need 11. The package is
      # an iOS library, so it is built for the simulator it targets.
      - name: Build the SwiftPM package for the iOS simulator
        working-directory: native/ios/NshFirebase
        run: xcodebuild -scheme NshFirebase -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' build
      - id: nsh-embed
        uses: ./.github/actions/fetch-nsh-embed-ios
      - run: cd examples/host-ios && xcodegen generate
      - run: >
          cd examples/host-ios && xcodebuild -project NshFirebaseHost.xcodeproj
          -scheme NshFirebaseHost -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build NSH_EMBED_IOS="${{ steps.nsh-embed.outputs.dir }}" build

  host-android:
    # The Firebase BoM module and the embedding host app assemble with the
    # Android SDK preinstalled on ubuntu runners.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4
        with:
          gradle-version: "9.3.1"
      - run: echo "ANDROID_HOME=$ANDROID_HOME" && gradle -p native/android assembleDebug
      - run: gradle -p examples/host-android :app:assembleDebug

  package:
    # Demo builds for every target the demo supports. Each one is uploaded as
    # an artifact; the publish job attaches them to the `latest` release.
    name: package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Desktop builds come out for the runner's own processor, so each architecture gets its own runner.
          # The three non-default architectures (builds: true) install NSH from SuperNSH/nsh-builds, which
          # has builds where NSH's own release has none.
          - { os: macos-latest, target: macos, name: macos-arm64 }
          - { os: macos-15-intel, target: macos, name: macos-x86_64, builds: true }
          - { os: ubuntu-latest, target: linux, name: linux-x86_64 }
          - { os: ubuntu-24.04-arm, target: linux, name: linux-arm64, builds: true }
          - { os: windows-latest, target: windows, name: windows-x86_64 }
          - { os: windows-11-arm, target: windows, name: windows-arm64, builds: true }
          - { os: macos-latest, target: ios-simulator, name: ios-simulator }
          - { os: ubuntu-latest, target: android, name: android }
          - { os: ubuntu-latest, target: web, name: web }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target == 'android' && 'aarch64-linux-android' || matrix.target == 'web' && 'wasm32-unknown-unknown' || matrix.target == 'ios-simulator' && 'aarch64-apple-ios-sim' || '' }}
      - uses: kunobi-ninja/kache-action@ad7317540dcdd71c904f7a60a87b620a0c0e67ed # v1
        with:
          version: v2.0.0
          cache-dir: ${{ runner.temp }}/kache
          manifest-key: package-${{ matrix.name }}
          cache-key-prefix: kache-package-${{ matrix.name }}
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          pr-comment: false
      - name: Install the wasm-bindgen CLI that NSH's web runtime needs
        if: matrix.target == 'web'
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: wasm-bindgen@0.2.129
      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_PACKAGES
      - uses: ./.github/actions/install-nsh
        if: ${{ !matrix.builds }}
      - name: Install NSH from nsh-builds
        if: matrix.builds && runner.os != 'Windows'
        env:
          NSH_VERSION: v0.4.0
        run: |
          curl -fsSL https://raw.githubusercontent.com/SuperNSH/nsh-builds/master/install.sh | sh
          echo "$HOME/.nsh/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install NSH from nsh-builds
        if: matrix.builds && runner.os == 'Windows'
        shell: pwsh
        env:
          NSH_VERSION: v0.4.0
        run: |
          irm https://raw.githubusercontent.com/SuperNSH/nsh-builds/master/install.ps1 | iex
          "$env:LOCALAPPDATA\nsh\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - uses: ./.github/actions/setup-siblings
        with:
          with-demo-links: "true"
      - name: Work around NSH 0.4.0's crates.io packaging of nsh-platform-ios
        if: matrix.target == 'ios-simulator'
        # The published crate includes a file it does not ship, so build NSH's crates from its v0.4.0 source.
        run: |
          git clone --quiet --depth 1 --branch v0.4.0 https://github.com/longbridge/nsh "$RUNNER_TEMP/nsh-src"
          mkdir -p examples/demo/.cargo
          {
            echo "[patch.crates-io]"
            for crate in "$RUNNER_TEMP"/nsh-src/crates/nsh-*; do
              echo "$(basename "$crate") = { path = \"$crate\" }"
            done
          } > examples/demo/.cargo/config.toml
      - name: Package
        shell: bash
        working-directory: examples/demo
        run: |
          abi=""
          [ "${{ matrix.target }}" = android ] && abi="--abi arm64-v8a"
          nsh package App.tsx --target ${{ matrix.target }} $abi --app-version 0.1.0 --build ${{ github.run_number }} --out "$RUNNER_TEMP/out"
      - name: Name the build
        shell: bash
        run: |
          mkdir -p dist
          cd "$RUNNER_TEMP/out"
          name="firebase-demo-${{ matrix.name }}"
          case "${{ matrix.target }}" in
            android) cp ./*.apk "$GITHUB_WORKSPACE/dist/$name.apk" ;;
            linux) cp ./*.tar.gz "$GITHUB_WORKSPACE/dist/$name.tar.gz" ;;
            macos|ios-simulator) ditto -c -k --keepParent ./*.app "$GITHUB_WORKSPACE/dist/$name.zip" ;;
            windows) 7z a "$GITHUB_WORKSPACE/dist/$name.zip" ./* > /dev/null ;;
            web) tar -czf "$GITHUB_WORKSPACE/dist/$name.tar.gz" * ;;
          esac
          ls -la "$GITHUB_WORKSPACE/dist"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish the latest build
    needs: [format, rust, cross-check, packages, emulator, demo, clean-proof, host-ios, host-android, package]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    concurrency:
      group: publish-latest
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - name: Replace the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh release delete latest --repo "$REPO" --cleanup-tag --yes || true
          gh release create latest dist/* --repo "$REPO" --target "$GITHUB_SHA" --latest \
            --title "Latest build" \
            --notes "Demo builds from main at $GITHUB_SHA, replaced on every push to main. Built for macOS, Linux and Windows (x86_64 and arm64 each), the iOS simulator, Android (arm64-v8a) and the web. Unsigned: macOS and Windows will warn before opening them, and the iOS build runs only in the simulator."

  pages:
    name: deploy the web demo to Pages
    needs: [publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Job-level permissions replace the workflow's, and deploy-pages authenticates with OIDC.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # The pages group, not ci-<ref>, so a deployment from an older run is cancelled by a newer one.
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-web
          path: dist
      - name: Unpack the web build
        run: |
          # NSH packages the web build inside a directory named after the app; the site root is its contents.
          mkdir -p "$RUNNER_TEMP/site"
          tar -xzf dist/firebase-demo-web.tar.gz -C "$RUNNER_TEMP/site" --strip-components=1
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
