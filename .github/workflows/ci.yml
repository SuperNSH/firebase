# The compile and test gates for nsh-firebase. Local runs are limited to
# implementation only (the build machine is often on battery), so CI is the
# place every gate is expected to pass. Every job runs on ubuntu because
# macOS hosted runners are currently blocked for this org (jobs are
# cancelled while queued); nsh 0.4.0 installs from the upstream release
# tarball, which ships a linux-x86_64 build. The Apple-tooling gates live
# in ci-macos.yml until macOS runners are enabled.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The workspace's demo-rs member path-depends on the sibling libs.
      - uses: ./.github/actions/setup-siblings
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  packages:
    # Every package area's TSX gate: nsh check, a warning-gated nsh build,
    # then the headless UI tests (scripts/test-packages.sh skips stubs).
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - uses: ./.github/actions/install-nsh
      - run: bun install
      - run: bun run test:packages

  emulator:
    # The labelled sandbox tests under project demo-nsh: sign up, sign in,
    # refresh, database write/read/live listener, storage upload/download/
    # delete, analytics+monitor against the collector. No real account.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: ./.github/actions/install-nsh
      - uses: ./.github/actions/setup-siblings
      - run: bun install
      # Java 21 mis-evaluates some cloud-storage rules (see docs/evidence/
      # core/storage-rules-fix.log); the glob form works everywhere, and 17
      # keeps the runtime on the well-tested path.
      - run: bun tools/collector/server.ts --out docs/evidence/perfmon/collector.jsonl &
      - run: bun run test:emulator

  demo:
    # The TSX demo gates plus the demo-rs crate gate.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/install-nsh
      - uses: ./.github/actions/setup-siblings
        with:
          with-demo-links: "true"
      - run: bun install
      - run: bash scripts/test-demo.sh
      - run: bash scripts/gate-crate.sh demo-rs

  clean-proof:
    # Criterion 3: the emulator tests pass from a clean checkout with one
    # documented command (bun install && bun run test:emulator).
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: ./.github/actions/install-nsh
      - name: Clean clone, one command
        run: |
          rm -rf /tmp/nsh-firebase-clean
          git clone -q --no-hardlinks "$GITHUB_WORKSPACE" /tmp/nsh-firebase-clean
          # Siblings beside the clean clone: demo-rs's relative deps and
          # the relative node_modules links resolve to /tmp from there.
          git clone -q --depth 1 https://github.com/SuperNSH/nsh-query.git /tmp/nsh-query
          git clone -q --depth 1 https://github.com/SuperNSH/nsh-form.git /tmp/nsh-form
          cd /tmp/nsh-firebase-clean
          bun install --frozen-lockfile
          bun run test:emulator

  host-android:
    # The Firebase BoM module and the embedding host app assemble with the
    # Android SDK preinstalled on ubuntu runners.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - run: echo "ANDROID_HOME=$ANDROID_HOME" && gradle -p native/android assembleDebug
      - run: gradle -p examples/host-android :app:assembleDebug
