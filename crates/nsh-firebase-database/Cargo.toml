[package]
name = "nsh-firebase-database"
description = "Firebase Realtime Database for Native Shell Rust apps (REST with SSE live listeners)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
nsh-core = { workspace = true }
nsh-engine = { workspace = true }
nsh-firebase-core = { workspace = true }
# preserve_order keeps a queried get()'s children in the order the query
# sorted them; without it serde_json's BTreeMap re-sorts keys lexicographically.
serde_json = { workspace = true, features = ["preserve_order"] }

[dev-dependencies]
nsh-engine = { workspace = true, features = ["net"] }
nsh-testing = { workspace = true }
