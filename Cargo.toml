[workspace]
members = [
    "crates/nsh-firebase-core",
    "crates/nsh-firebase-auth",
    "crates/nsh-firebase-database",
    "crates/nsh-firebase-storage",
    "crates/nsh-firebase-messaging",
    "crates/nsh-firebase-analytics",
    "crates/nsh-firebase-perf",
    "crates/nsh-firebase-firestore",
    "crates/nsh-firebase-remote-config",
    "crates/nsh-firebase-crashlytics",
    "crates/nsh-firebase-installations",
    "crates/nsh-firebase-app-check",
    "crates/nsh-firebase-functions",
    "examples/demo-rs",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/SuperNSH/firebase"
authors = ["hmziqrs"]

[workspace.dependencies]
# Every NSH crate must come from one place: the CLI's version (nsh 0.7.1).
nsh-core = "0.7.1"
nsh-engine = "0.7.1"
nsh-testing = "0.7.1"
serde_json = "1"
nsh-firebase-core = { path = "crates/nsh-firebase-core", version = "0.1.0" }
nsh-firebase-auth = { path = "crates/nsh-firebase-auth", version = "0.1.0" }
nsh-firebase-database = { path = "crates/nsh-firebase-database", version = "0.1.0" }
nsh-firebase-storage = { path = "crates/nsh-firebase-storage", version = "0.1.0" }
nsh-firebase-messaging = { path = "crates/nsh-firebase-messaging", version = "0.1.0" }
nsh-firebase-analytics = { path = "crates/nsh-firebase-analytics", version = "0.1.0" }
nsh-firebase-perf = { path = "crates/nsh-firebase-perf", version = "0.1.0" }
nsh-firebase-firestore = { path = "crates/nsh-firebase-firestore", version = "0.1.0" }
nsh-firebase-remote-config = { path = "crates/nsh-firebase-remote-config", version = "0.1.0" }
nsh-firebase-crashlytics = { path = "crates/nsh-firebase-crashlytics", version = "0.1.0" }
nsh-firebase-installations = { path = "crates/nsh-firebase-installations", version = "0.1.0" }
nsh-firebase-app-check = { path = "crates/nsh-firebase-app-check", version = "0.1.0" }
nsh-firebase-functions = { path = "crates/nsh-firebase-functions", version = "0.1.0" }

[profile.release]
lto = "thin"
