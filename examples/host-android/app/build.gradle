plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.nsh.firebase.host'
    compileSdk 36

    defaultConfig {
        applicationId 'dev.nsh.firebase.host'
        // The fixture's package_name must keep matching this id.
        minSdk 28
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation files('libs/nsh.aar')
    implementation project(':nshfirebase')
}
