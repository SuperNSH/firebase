pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode = RepositoriesMode.FAIL_ON_PROJECT_REPOS
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = 'nsh-firebase-host-android'

include ':app'
// One copy of the module: the host builds it in place from native/android.
include ':nshfirebase'
project(':nshfirebase').projectDir = file('../../native/android')
