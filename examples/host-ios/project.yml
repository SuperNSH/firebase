# The nsh-firebase embedding host. Generated with `xcodegen generate` in this
# directory. NativeShell is the 0.6.0 SDK that tools/fetch-nsh-embed.sh unpacks into
# .nsh-embed/; override NSH_EMBED_IOS to use another copy.
name: NshFirebaseHost
options:
  bundleIdPrefix: dev.nsh
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
packages:
  NshFirebase:
    path: ../../native/ios/NshFirebase
settings:
  base:
    SWIFT_VERSION: "5.10"
    # NativeShell.xcframework ships an arm64 simulator slice only.
    ARCHS: arm64
    NSH_EMBED_IOS: $(SRCROOT)/../../.nsh-embed/0.6.0/ios
targets:
  NshFirebaseHost:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: App/nsh
        type: folder
      - path: ../../fixtures/GoogleService-Info.plist
        buildPhase: resources
    dependencies:
      - package: NshFirebase
      - framework: ${NSH_EMBED_IOS}/NativeShell.xcframework
        embed: false
      # NativeShell's runtime references ASWebAuthenticationSession; older Xcode
      # SDKs do not autolink it, so link the framework explicitly.
      - sdk: AuthenticationServices.framework
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: nsh-firebase
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        # The SDK requires the UIScene life cycle; the delegate class is
        # wired here and the window is built in SceneDelegate.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        UIBackgroundModes:
          - remote-notification
        # We own the UIApplicationDelegate and wire FCM explicitly, so no
        # swizzler stands between it and us.
        FirebaseAppDelegateProxyEnabled: false
        CADisableMinimumFrameDurationOnPhone: true
    entitlements:
      path: Sources/NshFirebaseHost.entitlements
      properties:
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.nsh.firebase.host
schemes:
  NshFirebaseHost:
    build:
      targets:
        NshFirebaseHost: all
    run:
      config: Debug
